[project]
name = "pose-ml"
version = "0.1.0"
description = "ML backend para rehabilitación médica con pose estimation on-device (TFLite INT8, Android)"
requires-python = ">=3.11"
readme = "README.md"
# Las dependencias pesadas se gestionan por entorno en requirements-torch.txt / requirements-tf.txt.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
# Las dependencias (ultralytics, tensorflow, mediapipe) no tienen stubs completos.
ignore_missing_imports = true
